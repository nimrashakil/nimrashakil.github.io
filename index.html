<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimra Shakil — Content Strategist</title>
    <link rel="icon" type="image/png" href="logos/favicon.png">
    <link rel="apple-touch-icon" href="logos/avatar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
/* ---- Tokens ---- */
:root {
  --bg: #ffffff;
  --bg-2: #f8f9fa;
  --ink: #202124;
  --ink-2: #3c4043;
  --ink-3: #5f6368;
  --line: #e8eaed;
  --line-2: #dadce0;
  --gold: #1a73e8;
  --gold-2: #4285f4;
  --gold-soft: rgba(26, 115, 232, 0.14);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --glow: 0 12px 30px -8px rgba(26,115,232,0.5);
  --glow-strong: 0 18px 46px -10px rgba(26,115,232,0.62);
  --glow-soft: 0 16px 40px -20px rgba(26,115,232,0.34);
  --dur: .34s;
  --serif: "DM Serif Display", "Times New Roman", serif;
  --sans: "Instrument Sans", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
em, i { font-style: normal; }

/* ---- Artboard reset ---- */
.page {
  background: var(--bg);
  color: var(--ink);
  width: 100%;
  min-height: 100%;
  font-family: var(--sans);
  position: relative;
  overflow: hidden;
}

/* dot grid */
.page::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(0,0,0,0.045) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: 0;
}

/* ---- Nav ---- */
.nav {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 64px;
  background: #18191c;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.nav-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  transition: transform .25s ease, box-shadow .25s ease;
}
.nav-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.nav-icon:hover {
  transform: scale(1.04);
  box-shadow: 0 6px 22px rgba(26,115,232,0.28);
}
.nav-links {
  display: flex;
  gap: 10px;
  font-size: 14px;
  letter-spacing: 0.02em;
  color: var(--ink-2);
}
.nav-links a {
  padding: 9px 18px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.14);
  color: #e8eaed;
  transition: background .2s, color .2s, border-color .2s;
}
.nav-links a:hover { background: rgba(255,255,255,0.16); color: #fff; border-color: rgba(255,255,255,0.28); }
.nav-links a.active { background: var(--gold); border-color: var(--gold); color: #fff; }
.nav-cta {
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--gold);
  background: var(--gold);
  padding: 11px 20px;
  border-radius: 999px;
  color: #fff;
  transition: background .2s, border-color .2s;
}
.nav-cta:hover { background: var(--gold-2); border-color: var(--gold-2); }

/* ---- Section frame ---- */
.section {
  position: relative;
  z-index: 1;
  padding: 76px 64px;
  border-top: 1px solid var(--line);
}
.section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  margin-bottom: 44px;
}
.section-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.section-eyebrow::before {
  content: "";
  width: 24px;
  height: 1px;
  background: var(--gold);
}
.section-title {
  font-family: var(--serif);
  font-size: 72px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  margin-top: 14px;
  color: var(--ink);
}
.section-title em {
  font-style: normal;
  color: var(--gold);
}
.type-swap {
  font-style: normal;
  color: var(--gold);
  display: inline-block;
  white-space: nowrap;
}
.type-caret {
  display: inline-block;
  width: 3px;
  height: 0.82em;
  margin-left: 4px;
  background: var(--gold);
  vertical-align: baseline;
  transform: translateY(0.04em);
  animation: typeCaretBlink 0.8s steps(1) infinite;
}
.type-caret.hide { animation: none; opacity: 0; }
@keyframes typeCaretBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.section-link {
  font-size: 14px;
  color: var(--ink-2);
  border-bottom: 1px solid var(--line-2);
  padding-bottom: 4px;
}
.section-link:hover { color: var(--gold); border-color: var(--gold); }

/* ---- Metrics strip ---- */
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  padding: 56px 64px 64px;
  position: relative;
  z-index: 5;
  border-top: 1px solid var(--line);
}
.metrics.dark-block {
  background: #18191c;
  border-top: 0;
}
.metrics.dark-block .metric { border-color: rgba(255,255,255,0.12); }
.metrics.dark-block .metric-num { color: #fff; }
.metrics.dark-block .metric-label { color: #9aa0a6; }
.metric {
  padding: 8px 32px;
  border-left: 1px solid var(--line);
  position: relative;
}
.metric:first-child { border-left: 0; padding-left: 0; }
.metric.lift-1 { transform: translateY(-12px); }
.metric.lift-2 { transform: translateY(8px); }
.metric.lift-3 { transform: translateY(-4px); }
.metric.lift-4 { transform: translateY(14px); }
.metric-num {
  font-family: var(--serif);
  font-size: 64px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.metric-num .suffix { color: var(--gold); font-style: normal; font-size: 0.7em; margin-left: 2px; }
.metric-label {
  display: block;
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--ink-3);
  text-transform: uppercase;
}
.metric-bar {
  display: block;
  width: 32px;
  height: 1px;
  background: var(--gold);
  margin-top: 18px;
  opacity: 0.7;
}

/* ---- Case grid ---- */
.cases {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.case {
  position: relative;
  background: var(--bg);
  padding: 36px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  grid-column: span 2;
}
.case:nth-child(4) { grid-column: span 3; }
.case:nth-child(5) { grid-column: span 3; }
.case:hover { background: #f5f8ff; }
.case:hover h3 { color: var(--gold); }
.case:hover p { color: var(--ink-2); }
.case:hover .case-tag { color: var(--gold); }
.case:hover .case-stats { color: var(--ink-2); border-color: var(--line-2); }
.case:hover .case-stats span::before { background: var(--gold); }
.case-tag {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
}
.case h3 {
  font-family: var(--serif);
  font-size: 36px;
  line-height: 1;
  letter-spacing: -0.01em;
}
.case p {
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-2);
  flex: 1;
}
.case-stats {
  display: flex;
  gap: 24px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}
.case-stats span { display: inline-flex; align-items: center; gap: 6px; }
.case-stats span::before {
  content: "";
  width: 4px;
  height: 4px;
  background: var(--gold);
  border-radius: 50%;
}

/* ---- Services ---- */
.services {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 48px 56px;
}
.service {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-top: 28px;
  border-top: 1px solid var(--line-2);
}
.service-num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 0.12em;
}
.service h3 {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1.05;
  letter-spacing: -0.01em;
}
.service p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-2);
}

/* ---- Tools stack ---- */
.stack-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
}
.stack-col {
  padding: 0 28px;
  border-left: 1px solid var(--line);
}
.stack-col:first-child { border-left: 0; padding-left: 0; }
.stack-col h4 {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.stack-col h4::before {
  content: "";
  width: 6px;
  height: 6px;
  background: var(--gold);
  display: inline-block;
}
.stack-col ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
.stack-col li {
  display: flex;
  align-items: center;
  gap: 11px;
  opacity: 1;
  transform: none;
}
.stack-section .stack-col li {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity .55s cubic-bezier(.2,.7,.2,1), transform .55s cubic-bezier(.2,.7,.2,1);
}
.stack-section.is-in .stack-col li {
  opacity: 1;
  transform: none;
}
.stack-col li .tool-ico {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--gold-soft);
  color: var(--gold);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background .22s ease, color .22s ease, transform .28s cubic-bezier(.34,1.56,.64,1);
}
.stack-col li .tool-text {
  font-family: var(--serif);
  font-size: 21px;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--ink);
  transition: color .2s ease, transform .28s ease;
}
.stack-col li:hover .tool-ico {
  background: var(--gold);
  color: #fff;
  transform: scale(1.12) rotate(-6deg);
}
.stack-col li:hover .tool-text {
  color: var(--gold);
  transform: translateX(3px);
}
.stack-col li .sub {
  font-family: var(--sans);
  font-style: normal;
  font-size: 12px;
  color: var(--ink-3);
  margin-left: 8px;
  letter-spacing: 0.02em;
}
.stack-col li em {
  font-style: normal;
  color: var(--gold);
}

/* ---- Pull stat ---- */
.pullstat {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 64px;
  align-items: center;
  padding: 80px 64px;
  border-top: 1px solid var(--line);
  position: relative;
  z-index: 2;
}
.pullstat .big {
  font-family: var(--serif);
  font-size: 220px;
  line-height: 0.9;
  letter-spacing: -0.04em;
  color: var(--gold);
  animation: bigReveal 1s cubic-bezier(.2,.7,.2,1) both;
}
@keyframes bigReveal {
  from { opacity: 0; transform: translateY(18px) scale(0.94); }
  to { opacity: 1; transform: none; }
}
@keyframes colonPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.pullstat .big .colon { color: var(--ink); font-style: normal; animation: colonPulse 1.7s ease-in-out infinite; }
.pullstat .copy {
  font-family: var(--serif);
  font-size: 36px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.pullstat .copy em { font-style: normal; color: var(--gold); }
.pullstat .copy .src {
  display: block;
  margin-top: 24px;
  font-family: var(--sans);
  font-style: normal;
  font-size: 13px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ---- Footer ---- */
.footer {
  padding: 64px 64px 48px;
  border-top: 1px solid var(--line);
  position: relative;
  z-index: 2;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.7fr 1fr 1fr 1.15fr;
  gap: 40px 56px;
  align-items: start;
}
.footer-brand { padding-right: 24px; }
.footer-col h5,
.footer h5 {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 0 0 20px;
  font-weight: 600;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.footer .wordmark {
  font-family: var(--serif);
  font-style: normal;
  font-size: 36px;
  letter-spacing: -0.01em;
}
.footer .wordmark .wm-caret { background: var(--gold); }
.footer-bio {
  margin-top: 18px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-2);
  max-width: 340px;
}
.footer-list { list-style: none; display: flex; flex-direction: column; gap: 13px; }
.footer-list a, .footer-list li { font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.footer-list a:hover { color: var(--gold); }
/* structured "Now" column with status dots */
.footer-now li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  max-width: 230px;
}
.footer-now .now-dot {
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  margin-top: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 4px var(--gold-soft);
  animation: pulse 2.4s ease-in-out infinite;
}
.footer-now .now-dot.soft {
  background: var(--ink-3);
  box-shadow: none;
  animation: none;
}
.footer-bottom {
  margin-top: 64px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 24px;
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}
.footer-bottom > span:first-child { white-space: nowrap; }
.footer-credit { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 5px; white-space: nowrap; }
.footer-credit .dim { opacity: 0.62; }
.footer-credit b { font-weight: 600; }
.footer-credit .credit-arrow {
  display: inline-block;
  color: var(--gold);
  font-weight: 700;
  animation: creditArrow 1.8s ease-in-out infinite;
}
@keyframes creditArrow {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(4px); }
}

/* ---- CTA buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 24px;
  font-family: var(--sans);
  font-size: 14px;
  letter-spacing: 0.04em;
  border-radius: 999px;
  transition: all .2s;
  cursor: pointer;
}
.btn-primary {
  background: var(--gold);
  color: #ffffff;
  border: 1px solid var(--gold);
}
.btn-primary:hover { background: var(--gold-2); border-color: var(--gold-2); }
.btn-ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line-2);
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn .arrow { font-size: 16px; transform: translateY(-1px); }

/* ---- Hero shared ---- */
.hero {
  position: relative;
  padding: 80px 64px 64px;
  z-index: 1;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hero-eyebrow .eb-hl { color: var(--gold); }
.hero-eyebrow .dot {
  position: relative;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--gold);
  animation: dotCore 2.2s ease-in-out infinite;
}
.hero-eyebrow .dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--gold);
  animation: dotRipple 2.2s ease-out infinite;
}
@keyframes dotCore {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.82); opacity: 0.85; }
}
@keyframes dotRipple {
  0% { transform: scale(1); opacity: 0.45; }
  80%, 100% { transform: scale(3.4); opacity: 0; }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px var(--gold-soft); }
  50% { box-shadow: 0 0 0 8px rgba(26, 115, 232, 0.05); }
}

.hero-sub {
  margin-top: 24px;
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink-2);
  max-width: 540px;
  text-wrap: pretty;
}
.hero-ctas { margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; }

.hero-spec {
  margin-top: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.hero-spec .spec-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.hero-spec .spec-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.hero-spec .spec-tags span {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--ink-2);
  border: 1px solid var(--line-2);
  border-radius: 999px;
  padding: 4px 12px;
  transition: border-color .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
}
.hero-spec .spec-tags span:hover {
  border-color: var(--gold);
  color: var(--gold);
  transform: translateY(-1px);
}

/* ---- Hero (final) ---- */
.hero-final {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 64px;
  align-items: center;
  padding: 88px 64px 96px;
  position: relative;
  z-index: 1;
}
.hero-left { position: relative; z-index: 2; }
.hero-title {
  font-family: var(--serif);
  font-size: clamp(46px, 6.6vw, 84px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  color: var(--ink);
  margin: 28px 0 0;
  text-wrap: pretty;
}
.hero-title em {
  font-style: normal;
  color: var(--gold);
  padding-right: 0.08em;
  background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold) 60%, #1557b0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero-title em.ink-em {
  background: none;
  -webkit-text-fill-color: var(--ink);
  color: var(--ink);
}
.word-cycle {
  position: relative;
  display: block;
  height: 1.22em;
  line-height: 1;
  margin-top: 0.04em;
}
.word-cycle-item {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  font-style: normal;
  color: var(--gold);
  transition: opacity .42s cubic-bezier(.2,.7,.2,1), transform .42s cubic-bezier(.2,.7,.2,1);
}
.hero-microproof {
  margin-top: 44px;
  display: flex;
  align-items: center;
  gap: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.mp-item { font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em; }
.mp-item b { font-family: var(--serif); font-weight: 400; color: var(--ink); font-size: 18px; margin-right: 6px; letter-spacing: -0.01em; }
.mp-sep { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; opacity: 0.7; }

.hero-right {
  position: relative;
  height: 520px;
}
.stack-stage {
  position: relative;
  width: 100%;
  height: 100%;
}
.stage-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* tool tile */
/* tool tile — drift on the wrapper, hover on the card (prevents jitter) */
.tile-wrap {
  position: absolute;
  z-index: 2;
}
.tile-wrap:hover {
  z-index: 7;
  animation-play-state: paused;
}
.tile {
  width: 112px;
  height: 112px;
  background: #ffffff;
  border: 1px solid var(--line-2);
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  box-shadow: 0 10px 28px rgba(60,64,67,0.14), inset 0 1px 0 rgba(255,255,255,0.6);
  transition: transform .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
  cursor: pointer;
  transform: translateZ(0);
  backface-visibility: hidden;
}
.tile:hover {
  border-color: var(--gold);
  transform: scale(1.05);
  box-shadow: var(--glow), 0 10px 24px rgba(60,64,67,0.14);
}
.tile:active {
  transform: scale(1.02);
  transition-duration: .12s;
}
.tile-mark { color: var(--gold); display: inline-flex; }
.tile-logo {
  height: 30px;
  width: auto;
  max-width: 54px;
  object-fit: contain;
  display: block;
  transition: transform .35s var(--ease);
}
.tile:hover .tile-logo { transform: scale(1.1); }
.tile-logo-wp { height: 38px; max-width: 40px; }
.tile-name {
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-2);
}

/* result card */
.result-card {
  position: absolute;
  background: #ffffff;
  border: 1px solid #cdd1d6;
  border-radius: 20px;
  padding: 18px 20px;
  box-shadow: 0 40px 70px -16px rgba(26,115,232,0.34), 0 10px 24px rgba(60,64,67,0.16);
  z-index: 4;
  min-width: 184px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.result-card::before {
  content: "";
  position: absolute;
  top: 0; left: 18px; right: 18px;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: linear-gradient(90deg, var(--gold), var(--gold-2));
}
.result-card.big {
  min-width: 250px;
  padding: 22px 24px;
  box-shadow: 0 54px 90px -18px rgba(26,115,232,0.42), 0 14px 30px rgba(60,64,67,0.18);
}
.result-card.small { min-width: 184px; }
.rc-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}
.rc-value {
  font-family: var(--serif);
  font-size: 54px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin: 8px 0 4px;
  display: inline-flex;
  align-items: baseline;
}
.result-card.big .rc-value { font-size: 64px; }
.rc-value span { color: var(--gold); font-style: normal; font-size: 0.55em; margin-left: 2px; }
.rc-value i { color: var(--gold); font-style: normal; font-size: 0.55em; margin-left: 2px; }
.rc-value.sm { font-size: 42px; }
.rc-label { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.result-card .spark { margin-top: 10px; display: block; }

/* responsive collapse */
@media (max-width: 1100px) {
  .hero-final { grid-template-columns: 1fr; gap: 48px; }
  .hero-right { height: 520px; }
}
/* phones: render the floating composition at its native design size and let JS
   scale it to fit, centered — so cards never spill past the column */
@media (max-width: 760px) {
  .hero-right {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stack-stage {
    width: 540px;
    height: 520px;
    flex: 0 0 540px;
  }
}
.heroA { padding: 60px 64px 80px; }
.heroA-stage {
  position: relative;
  text-align: center;
  padding: 24px 0 32px;
  min-height: 760px;
}
.heroA-eyebrow-wrap { display: flex; justify-content: center; margin-bottom: 28px; }

.heroA-title {
  font-family: var(--serif);
  color: var(--ink);
  position: relative;
  z-index: 2;
  pointer-events: none;
}
.heroA-title {
  /* keep title centered in a narrower column so the side gutters stay clean */
  max-width: 980px;
  margin: 0 auto;
}
.heroA-title .l1 {
  display: block;
  font-style: normal;
  font-size: 72px;
  line-height: 0.9;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.heroA-title .l2 {
  display: block;
  font-size: 220px;
  line-height: 0.82;
  letter-spacing: -0.04em;
  color: var(--gold);
  background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold) 60%, #1557b0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: -4px;
}
.heroA-title .l3 {
  display: block;
  font-style: normal;
  font-size: 152px;
  line-height: 0.88;
  letter-spacing: -0.03em;
  color: var(--ink);
  margin-top: -6px;
}

.heroA-foot {
  margin-top: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  position: relative;
  z-index: 5;
}
.heroA-foot .hero-sub { text-align: center; }
.heroA-foot .hero-ctas { justify-content: center; }

/* Floating chips (hero A) */
.float-layer { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.chip, .mini-card {
  position: absolute;
  background: #ffffff;
  border: 1px solid var(--line-2);
  border-radius: 14px;
  box-shadow: 0 10px 32px rgba(60,64,67,0.16), inset 0 1px 0 rgba(255,255,255,0.6);
  font-family: var(--sans);
  pointer-events: auto;
}
.chip {
  padding: 10px 16px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--ink);
  letter-spacing: 0.01em;
  border-radius: 999px;
}
.chip .ico {
  width: 16px; height: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px;
  color: var(--gold);
}
.chip.outlined {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
}
.chip.tag-gold {
  background: var(--gold);
  color: #ffffff;
  border-color: var(--gold);
}

.mini-card {
  padding: 14px 16px;
  min-width: 180px;
}
.mini-card .label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.mini-card .value {
  font-family: var(--serif);
  font-size: 28px;
  letter-spacing: -0.02em;
  color: var(--gold);
  margin-top: 4px;
}
.mini-card .spark {
  margin-top: 10px;
  display: block;
}

/* float animations — gentle, slow drift */
@keyframes drift1 {
  0%, 100% { transform: translate(0, 0) rotate(-1.2deg); }
  50% { transform: translate(4px, -7px) rotate(-0.4deg); }
}
@keyframes drift2 {
  0%, 100% { transform: translate(0, 0) rotate(1.4deg); }
  50% { transform: translate(-5px, 6px) rotate(0.6deg); }
}
@keyframes drift3 {
  0%, 100% { transform: translate(0, 0) rotate(-0.8deg); }
  50% { transform: translate(6px, 5px) rotate(0.2deg); }
}
@keyframes drift4 {
  0%, 100% { transform: translate(0, 0) rotate(0.8deg); }
  50% { transform: translate(-5px, -6px) rotate(1.4deg); }
}

.drift-1 { animation: drift1 9.5s ease-in-out infinite; }
.drift-2 { animation: drift2 11s ease-in-out infinite; }
.drift-3 { animation: drift3 10.2s ease-in-out infinite; }
.drift-4 { animation: drift4 12s ease-in-out infinite; }

/* ---- Hero B — Split editorial ---- */
.heroB {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 48px;
  align-items: center;
  padding: 64px 64px 80px;
  position: relative;
  z-index: 1;
}
.heroB-left { position: relative; z-index: 2; }
.heroB-title {
  font-family: var(--serif);
  margin-top: 24px;
}
.heroB-title .l1 {
  display: block;
  font-style: normal;
  font-size: 64px;
  line-height: 0.9;
  letter-spacing: -0.02em;
}
.heroB-title .l2 {
  display: block;
  font-size: 168px;
  line-height: 0.82;
  letter-spacing: -0.04em;
  background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold) 65%, #1557b0 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.heroB-title .l3 {
  display: block;
  font-style: normal;
  font-size: 124px;
  line-height: 0.85;
  letter-spacing: -0.03em;
  margin-top: -4px;
}

.heroB-right {
  position: relative;
  height: 640px;
}

/* dashboard card */
.dash-card {
  position: absolute;
  background: #ffffff;
  border: 1px solid var(--line-2);
  border-radius: 18px;
  box-shadow: 0 18px 60px rgba(60,64,67,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
  padding: 22px;
}
.dash-card.serp {
  top: 40px; left: 20px;
  width: 380px;
  animation: drift3 11s ease-in-out infinite;
}
.dash-card.ai {
  top: 220px; left: 200px;
  width: 360px;
  animation: drift2 13s ease-in-out infinite;
}
.dash-card.metric {
  top: 30px; right: -20px;
  width: 250px;
  animation: drift1 9s ease-in-out infinite;
}
.dash-card.kw {
  top: 460px; left: 60px;
  width: 280px;
  animation: drift4 12s ease-in-out infinite;
}

.dash-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.dash-row .tag { font-family: var(--mono); font-size: 11px; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; }
.dash-card h6 {
  font-family: var(--serif);
  font-size: 22px;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 14px 0 10px;
  font-weight: 400;
}
.dash-card p {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-2);
}
.dash-card .url {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  margin-bottom: 4px;
  letter-spacing: 0.02em;
}

.kpi {
  font-family: var(--serif);
  font-size: 52px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--gold);
  margin: 8px 0 4px;
}
.kpi-delta {
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
}

.heroB-chips { position: absolute; inset: 0; pointer-events: none; }

/* ---- Dark section modifier (e.g. "What I do") ---- */
.section--dark {
  background: #18191c;
  border-top: 0;
}
.section--dark::before { background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); }
.section--dark .section-title { color: #fff; }
.section--dark .section-eyebrow { color: #9aa0a6; }
.section--dark .service {
  border-top: 0;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 16px;
  padding: 26px 24px;
}
.section--dark .service h3 { color: #fff; }
.section--dark .service p { color: #c4c7cb; }
.section--dark .service:hover {
  background: rgba(255,255,255,0.03);
  border-color: rgba(66,133,244,0.32);
}

/* ---- Structured stack intro ---- */
.stack-intro {
  max-width: 340px;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
  border-top: 1px solid var(--line-2);
  padding-top: 16px;
}
.stack-intro .stack-intro-label {
  display: block;
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}

/* ---- Dark footer ---- */
.footer--dark {
  background: #18191c;
  border-top: 0;
}
.footer--dark h5 { color: #9aa0a6; }
.footer--dark .wordmark { color: #fff; }
.footer--dark .wm-text { color: #fff; }

/* typewriter wordmark */
.wm-type {
  display: inline-flex;
  align-items: baseline;
  white-space: nowrap;
  min-height: 1.1em;
}
.wm-text { color: #fff; }
.wm-caret {
  display: inline-block;
  width: 2px;
  height: 0.92em;
  margin-left: 3px;
  background: var(--gold);
  transform: translateY(0.06em);
}
.wm-caret.blink { animation: caretBlink 0.85s steps(1) infinite; }
.wm-caret.hide { opacity: 0; }
@keyframes caretBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.footer--dark .footer-bio { color: #c4c7cb; }
.footer--dark .footer-col h5, .footer--dark h5 { color: #9aa0a6; border-bottom-color: rgba(255,255,255,0.12); }
.footer--dark .footer-list a, .footer--dark .footer-list li { color: #c4c7cb; }
.footer--dark .footer-list a:hover { color: var(--gold-2); }
.footer--dark .footer-bottom { color: #9aa0a6; border-color: rgba(255,255,255,0.12); }
.footer--dark .footer-credit b { color: #e8eaed; }
.footer--dark .footer-now .now-dot.soft { background: #5f6368; }

/* footer magic: soft aurora glow + live local clock */
.footer--dark { overflow: hidden; }
.footer-aurora {
  position: absolute;
  top: -40%;
  left: 50%;
  width: 120%;
  height: 150%;
  transform: translateX(-50%);
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(38% 42% at 22% 18%, rgba(66,133,244,0.20), transparent 70%),
    radial-gradient(34% 40% at 82% 30%, rgba(26,115,232,0.16), transparent 72%);
  filter: blur(14px);
  animation: footerAurora 16s ease-in-out infinite alternate;
}
@keyframes footerAurora {
  0%   { transform: translateX(-52%) translateY(0) scale(1); opacity: 0.85; }
  100% { transform: translateX(-48%) translateY(22px) scale(1.08); opacity: 1; }
}
.footer--dark .footer-grid, .footer--dark .footer-bottom { position: relative; z-index: 1; }
.footer-clock {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  margin-top: 22px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  color: #9aa0a6;
}
.footer-clock .clock-time { color: #e8eaed; font-weight: 500; }
.footer-clock .clock-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #34c759;
  box-shadow: 0 0 0 4px rgba(52,199,89,0.16);
  animation: pulse 2.4s ease-in-out infinite;
}

/* ---- Hero trend chart (background) ---- */
.trend-bg {
  position: absolute;
  left: -12px;
  right: -12px;
  bottom: 40px;
  width: calc(100% + 24px);
  height: 360px;
  z-index: 0;
  opacity: 0.6;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 72%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 10%, #000 72%, transparent 100%);
}
.trend-line {
  stroke-dasharray: 1400;
  stroke-dashoffset: 1400;
  animation: trendDraw 5.5s ease-in-out 0.4s infinite;
}
.trend-line-2 {
  stroke-dasharray: 1400;
  stroke-dashoffset: 1400;
  animation: trendDraw 5.5s ease-in-out 0.7s infinite;
}
@keyframes trendDraw {
  0%   { stroke-dashoffset: 1400; opacity: 1; }
  38%  { stroke-dashoffset: 0; opacity: 1; }
  82%  { stroke-dashoffset: 0; opacity: 1; }
  93%  { stroke-dashoffset: 0; opacity: 0; }
  94%  { stroke-dashoffset: 1400; opacity: 0; }
  100% { stroke-dashoffset: 1400; opacity: 1; }
}

/* ---- Unified interactive treatment (hover + click glow) ---- */
/* Every interactive element lifts smoothly and casts the same blue glow on hover,
   then presses in with a stronger glow on click. Excludes the tools section. */
.btn, .nav-icon, .nav-links a, .nav-cta, .case, .service, .section-link,
.footer-list a, .badge-live, .badge-rank, .result-card {
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              color var(--dur) var(--ease);
}

/* hover = lift + blue glow */
.btn:hover, .nav-cta:hover, .nav-icon:hover,
.badge-live:hover, .badge-rank:hover {
  transform: translateY(-3px);
  box-shadow: var(--glow);
}
.nav-links a:hover { transform: translateY(-2px); box-shadow: var(--glow); }
.case:hover { transform: translateY(-3px); z-index: 2; box-shadow: var(--glow-soft); }
.service:hover { transform: translateY(-2px); border-color: rgba(66,133,244,0.32); box-shadow: 0 14px 32px -24px rgba(26,115,232,0.3); }
.result-card:hover { transform: translateY(-4px); box-shadow: var(--glow-strong), 0 12px 28px rgba(60,64,67,0.16); }
.section-link:hover { box-shadow: 0 8px 22px -8px rgba(26,115,232,0.5); }

/* click = pressed-in with a stronger glow (uniform across the page) */
.btn:active, .nav-cta:active, .nav-icon:active, .nav-links a:active,
.case:active, .service:active, .section-link:active,
.badge-live:active, .badge-rank:active, .result-card:active {
  transform: translateY(-1px) scale(0.985);
  box-shadow: var(--glow-strong);
  transition-duration: .12s;
}

/* keyboard focus mirrors the same glow */
.btn:focus-visible, .nav-cta:focus-visible, .nav-icon:focus-visible,
.nav-links a:focus-visible, .case:focus-visible, .service:focus-visible,
.footer-list a:focus-visible {
  outline: none;
  box-shadow: var(--glow-strong);
}

/* per-element niceties kept */
.btn .arrow { transition: transform var(--dur) var(--ease); }
.btn:hover .arrow { transform: translateX(5px); }
.case:hover { background: #f5f8ff; }
.service:hover h3 { color: var(--gold-2); }
.service h3 { transition: color var(--dur) var(--ease); }
.case h3, .case p, .case-tag, .case-stats { transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.footer-list a:hover { transform: translateX(4px); }

/* ---- Hero fun accents ---- */
.fun-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.badge-live, .badge-rank {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  border: 1px solid #d2d5da;
  border-radius: 999px;
  padding: 8px 15px;
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink);
  box-shadow: 0 10px 26px rgba(60,64,67,0.18);
  pointer-events: auto;
}
.badge-rank { color: var(--gold); }
.result-card.score-card {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 7px 8px;
  border-radius: 14px;
  box-shadow: 0 10px 26px rgba(60,64,67,0.16);
  pointer-events: auto;
}
.score-card::before { content: none; }
.score-card .score-ring {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex: 0 0 auto;
}
.score-card .score-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 12.5px;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.score-card .score-meta {
  display: flex;
  flex-direction: column;
  gap: 1px;
  line-height: 1.2;
}
.score-card .score-meta b {
  font-family: var(--mono);
  font-size: 8.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
  white-space: nowrap;
  color: var(--gold);
}
.score-card .score-meta > span {
  font-size: 10px;
  color: var(--ink-3);
  white-space: nowrap;
}
.score-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--glow);
}
.badge-live .live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 4px var(--gold-soft);
  animation: pulse 2s ease-in-out infinite;
}
.badge-up {
  position: absolute;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--gold);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  box-shadow: 0 12px 28px rgba(26,115,232,0.42);
}
.spark-star {
  position: absolute;
  color: var(--gold);
  animation: twinkle 2.8s ease-in-out infinite;
}
.spark-star:nth-of-type(2) { animation-delay: 0.7s; }
.spark-star:nth-of-type(3) { animation-delay: 1.3s; }
.spark-star:nth-of-type(4) { animation-delay: 1.9s; }
@keyframes twinkle {
  0%, 100% { transform: scale(0.55); opacity: 0.18; }
  50% { transform: scale(1); opacity: 0.7; }
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .trend-line, .trend-line-2 { stroke-dashoffset: 0; }
  .trend-bg { clip-path: inset(0 0 0 0); transform: none; }
}

    html, body { margin: 0; padding: 0; background: var(--bg); }
    #root { width: 100%; min-height: 100vh; }

// ---- animated counter ----
function useCounter(target, { duration = 1600, suffix = "", prefix = "" } = {}) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    let raf, start;
    let started = false;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !started) {
        started = true;
        const animate = (t) => {
          if (!start) start = t;
          const p = Math.min(1, (t - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          setVal(target * eased);
          if (p < 1) raf = requestAnimationFrame(animate);
        };
        raf = requestAnimationFrame(animate);
      }
    }, { threshold: 0.3 });
    if (ref.current) obs.observe(ref.current);
    return () => { obs.disconnect(); cancelAnimationFrame(raf); };
  }, [target, duration]);
  return [ref, val, prefix, suffix];
}

function format(n, kind) {
  if (kind === "k") return Math.round(n).toLocaleString() + "K";
  if (kind === "pct") return Math.round(n) + "%";
  if (kind === "int") return Math.round(n);
  return Math.round(n);
}

// types a heading smoothly, once, when scrolled into view (pre + blue em + post)
function TypeOnce({ pre, em, post = "." }) {
  const ref = useRef(null);
  const full = pre + em + post;
  const [n, setN] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let started = false;
    const timers = [];
    const run = () => {
      let i = 0;
      const tick = () => {
        i += 1;
        setN(i);
        if (i < full.length) timers.push(setTimeout(tick, 58));
        else timers.push(setTimeout(() => setDone(true), 450));
      };
      timers.push(setTimeout(tick, 100));
    };
    const check = () => {
      if (started) return;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (r.top < vh - 60 && r.bottom > 40) {
        started = true;
        run();
        window.removeEventListener("scroll", check);
        window.removeEventListener("resize", check);
      }
    };
    window.addEventListener("scroll", check, { passive: true });
    window.addEventListener("resize", check);
    check();
    return () => {
      window.removeEventListener("scroll", check);
      window.removeEventListener("resize", check);
      timers.forEach(clearTimeout);
    };
  }, []);
  const preLen = pre.length, emEnd = pre.length + em.length;
  const shownPre = full.slice(0, Math.min(n, preLen));
  const shownEm = n > preLen ? full.slice(preLen, Math.min(n, emEnd)) : "";
  const shownPost = n > emEnd ? full.slice(emEnd, n) : "";
  return (
    <span className="type-once" ref={ref}>
      {shownPre}<em>{shownEm}</em>{shownPost}<span className={`type-caret ${done ? "hide" : ""}`}></span>
    </span>
  );
}

function TypeSwap() {
  // shows "wands", quickly backspaces it, then types "tools"
  const ref = useRef(null);
  const [text, setText] = useState("wands");
  const [done, setDone] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let started = false;
    const timers = [];
    const run = () => {
      const from = "wands";
      const to = "tools";
      let t = 0;
      // hold "wands" briefly, then delete letter by letter
      timers.push(setTimeout(() => {
        let i = from.length;
        const del = () => {
          i -= 1;
          setText(from.slice(0, i));
          if (i > 0) timers.push(setTimeout(del, 70));
          else {
            // type "tools"
            let j = 0;
            const type = () => {
              j += 1;
              setText(to.slice(0, j));
              if (j < to.length) timers.push(setTimeout(type, 95));
              else timers.push(setTimeout(() => setDone(true), 500));
            };
            timers.push(setTimeout(type, 120));
          }
        };
        del();
      }, 650));
    };
    const check = () => {
      if (started) return;
      const r = el.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (r.top < vh - 60 && r.bottom > 40) {
        started = true;
        run();
        window.removeEventListener("scroll", check);
        window.removeEventListener("resize", check);
      }
    };
    window.addEventListener("scroll", check, { passive: true });
    window.addEventListener("resize", check);
    check();
    return () => {
      window.removeEventListener("scroll", check);
      window.removeEventListener("resize", check);
      timers.forEach(clearTimeout);
    };
  }, []);
  return (
    <em className="type-swap" ref={ref}>
      {text}<span className={`type-caret ${done ? "hide" : ""}`}></span>
    </em>
  );
}

const { useState: useStateH, useEffect: useEffectH } = React;

function Spark({ w = 180, h = 36, points }) {
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const step = w / (points.length - 1);
  const path = points.map((p, i) => {
    const x = i * step;
    const y = h - ((p - min) / range) * h;
    return `${i === 0 ? "M" : "L"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const lastY = h - ((points[points.length - 1] - min) / range) * h;
  const area = path + ` L${w},${h} L0,${h} Z`;
  return (
    <svg className="spark" width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      <defs>
        <linearGradient id="sparkfill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="var(--gold)" stopOpacity="0.28" />
          <stop offset="100%" stopColor="var(--gold)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#sparkfill)" />
      <path d={path} fill="none" stroke="var(--gold)" strokeWidth="1.5" />
      <circle cx={w} cy={lastY} r="3" fill="var(--gold)" />
    </svg>
  );
}

function useTicker(base, range, ms = 1400) {
  const [v, setV] = useStateH(base);
  useEffectH(() => {
    const id = setInterval(() => setV(base + (Math.random() - 0.5) * range), ms);
    return () => clearInterval(id);
  }, [base, range, ms]);
  return v;
}

    const mqMobile = window.matchMedia("(max-width: 760px)");

    let raf = null;
    let teardownParallax = null;

    // On phones the composition is rendered at its native 540px design width
    // and scaled down to fit the column, so cards never spill / clip.
    const DESIGN_W = 540, DESIGN_H = 520;
    const fitMobile = () => {
      const avail = parent.clientWidth;
      const scale = Math.min(1, avail / DESIGN_W);
      stage.style.transformOrigin = "center center";
      stage.style.transform = `scale(${scale})`;
      parent.style.height = (DESIGN_H * scale) + "px";
    };

    const startParallax = () => {
      let tx = 0, ty = 0, sx = 0, sy = 0, fx = 0, fy = 0;
      const onMove = (e) => {
        const r = stage.getBoundingClientRect();
        tx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width / 2)) / (r.width / 2)));
        ty = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height / 2)) / (r.height / 2)));
      };
      const onLeave = () => { tx = 0; ty = 0; };
      const loop = () => {
        // two layers ease at different rates so they drift out of lockstep (organic)
        sx += (tx - sx) * 0.045; sy += (ty - sy) * 0.045;
        fx += (tx - fx) * 0.075; fy += (ty - fy) * 0.075;
        stage.style.transform = `translate(${sx * -5}px, ${sy * -5}px) rotate(${sx * 0.35}deg)`;
        if (funRef.current) funRef.current.style.transform = `translate(${fx * -13}px, ${fy * -13}px) rotate(${fx * -0.7}deg)`;
        raf = requestAnimationFrame(loop);
      };
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseout", onLeave);
      raf = requestAnimationFrame(loop);
      return () => {
        if (raf) cancelAnimationFrame(raf);
        raf = null;
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseout", onLeave);
      };
    };

    const apply = () => {
      // reset any prior mode
      if (teardownParallax) { teardownParallax(); teardownParallax = null; }
      stage.style.transform = "";
      stage.style.transformOrigin = "";
      parent.style.height = "";
      if (mqMobile.matches) {
        fitMobile();
      } else if (!reduce) {
        teardownParallax = startParallax();
      }
    };

    apply();
    const onResize = () => { if (mqMobile.matches) fitMobile(); };
    window.addEventListener("resize", onResize);
    mqMobile.addEventListener("change", apply);
    return () => {
      window.removeEventListener("resize", onResize);
      mqMobile.removeEventListener("change", apply);
      if (teardownParallax) teardownParallax();
    };
  }, []);

      </div>

      <div className="hero-right">
        <div className="stack-stage" ref={stageRef}>
          {/* Background trend chart — rising organic line */}
          <svg className="trend-bg" viewBox="0 0 560 300" preserveAspectRatio="none">

              <linearGradient id="trendfill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor="var(--gold)" stopOpacity="0.18" />

            </defs>
            <g stroke="rgba(60,64,67,0.10)" strokeWidth="1">
              <line x1="0" y1="60" x2="560" y2="60" />
              <line x1="0" y1="120" x2="560" y2="120" />
              <line x1="0" y1="180" x2="560" y2="180" />

            </g>
            <path d="M0 255 L70 240 L140 212 L210 224 L280 178 L350 150 L420 116 L490 78 L560 38 L560 300 L0 300 Z" fill="url(#trendfill)" />
            <path className="trend-line-2" d="M0 278 L70 270 L140 252 L210 256 L280 226 L350 206 L420 182 L490 152 L560 118" fill="none" stroke="#9cc0fb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            <path className="trend-line" d="M0 255 L70 240 L140 212 L210 224 L280 178 L350 150 L420 116 L490 78 L560 38" fill="none" stroke="var(--gold)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            <circle cx="280" cy="178" r="3.5" fill="var(--gold)" />

          {/* Tool tiles — distributed to fill the field */}
          <Tile mark={<img className="tile-logo" src="logos/chatgpt.png" alt="" />} name="ChatGPT"  anim="drift-2" style={{ top: 22, right: 28 }} />

          {/* Floating result cards */}

          {/* Fun floating accents */}

}
